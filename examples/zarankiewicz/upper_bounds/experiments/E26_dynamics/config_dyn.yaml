# E26 dynamics config: a COPY of config.yaml (prompt, database, islands, MAP-Elites bins unchanged)
# with: 50 iterations, checkpoint every 10, cascade off (the wrapper evaluator runs the live evaluate()
# = stage 1 then full score), ONE worker (deterministic iteration order), evaluator timeout 2400 s.
# The llm section is replaced in-process by run_dynamics.py (E26 GenomeMutator).
max_iterations: 50
checkpoint_interval: 10
log_level: INFO
random_seed: 42
llm:
  api_base: https://openrouter.ai/api/v1
  models:
  - name: deepseek/deepseek-v4-flash
    weight: 0.5
  - name: openai/gpt-5.6-luna
    weight: 0.3
  - name: google/gemini-3.8-flash
    weight: 0.2
  reasoning_effort: low
  temperature: 0.6
  top_p: 0.95
  max_tokens: 30000
  timeout: 600
  retries: 2
prompt:
  system_message: "You are an expert in extremal combinatorics and in the Lean 4 theorem prover (Lean 4.34, Mathlib available).\n\
    We are proving UPPER bounds on Zarankiewicz numbers z(m,n;s,t) = the maximum number of ones in an\nm x n 0/1 matrix with\
    \ no all-ones s x t submatrix (no s rows sharing t common 1-columns).\nMethod (Tan 2022): to show z(m,n;s,t) < w we split\
    \ \"a valid matrix with >= w ones exists\" into CASES,\none per pair (row-sum partition, column-sum partition): non-increasing\
    \ integer vectors rows (length m,\nentries <= n) and cols (length n, entries <= m) with sum(rows) = sum(cols) = w. Every\
    \ case is either\nPRUNED by a Lean-verified argument or handed to a SAT solver with a checked certificate. You evolve\
    \ the\nPRUNE LIBRARY: counting/structural arguments showing a case is EMPTY (no K_{s,t}-free matrix has exactly\nthose\
    \ row and column sums), so that fewer and cheaper SAT calls remain.\nPRUNING IS NOT ADDING: symmetry breaking (\"assume\
    \ sorted\", \"transpose\", \"w.l.o.g.\") is NOT a prune; the\nevaluator holds SAT witnesses for many cases and any kill\
    \ of a realizable case scores 0.\n\nThe program you edit has FOUR coupled objects inside the EVOLVE block:\n  NOTES  \
    \      the natural-language argument (shown back to you, never scored).\n  LEAN_SOURCE  Lean 4 code spliced into `namespace\
    \ ZarPrune.Cand` after `import ZarPrune`. It must define\n               `def candidate (P : Params) : Prune P` (general;\
    \ preferred) or `def candidate : Prune target`.\n               A Prune P is {name, kill : Profile P.m P.n -> Bool, sound\
    \ : ∀ A, kill (profileOf A) = true -> ¬ Valid P A}\n               with Valid P A := ¬ HasKst P A ∧ P.w ≤ weight A; a\
    \ Profile has row : Fin m -> Nat, col : Fin n -> Nat.\n               NO import, NO axiom, NO native_decide, NO unsafe/implemented_by/opaque/partial,\
    \ NO `#` commands,\n               NO IO, NO `namespace`/`end`, NO redefinition of Valid/HasKst/Params/Profile/Prune/counting.\n\
    \               The scan also reads COMMENTS and STRINGS: never write a forbidden word (partial, axiom, IO,\n        \
    \       trace, syntax, notation, namespace, ...) even in a comment. Write `s.card`, never `#s`. The\n               wrapper\
    \ sets `set_option autoImplicit false`: declare every variable. The only allowed\n               set_option are maxHeartbeats\
    \ (<= 400000) and maxRecDepth (<= 4096). Holes: exactly\n               `have h : T := by sorry` inside `sound := by`\
    \ (nowhere else).\n  SCHEMA_DATA  JSON parameters for the once-proved Farkas schema (lean/ZarPrune/Schemas.lean, `Prune.ofFarkas`)\n\
    \               that the harness instantiates for you: {\"farkas\": [ {\"m\": 10, \"n\": 11, \"s\": 3, \"t\": 3, \"y\"\
    : [...]}, ... ],\n               \"residue\": [], \"prefix\": []}. A certificate y is a flat list of Nat multipliers\n\
    \               [y1p, y1m, l_0..l_{m-1}, u_0..u_{m-1}, y3(pairs), y4(pairs)] (pairs (i,i') i<i' in lexicographic\n   \
    \            order; 2+2m+m(m-1) entries, trailing zeros may be dropped) for the hidden pair-codegree system\n        \
    \       F1 Σ λ = Σ_j c_j(c_j-1) (y1p ≤ / y1m ≥), F2 lo_i ≤ Σ_{i'} λ_{ii'} ≤ hi_i (l_i / u_i), F3 λ_{ii'} ≤\n         \
    \      min(Lcap, r_i, r_i') (y3), F4 λ_{ii'} ≥ r_i + r_i' - n (y4); a case is killed when\n               Σ y·a ≥ 0 coefficientwise\
    \ and the combined right-hand side is < 0. Dict entries fire only on\n               their (m,n,s,t) cell. Search for\
    \ certificates in Python inside the EVOLVE block with\n               zar_ub.lemmas.farkas_certificate(m, n, s, t, rows,\
    \ cols) (dual LP via scipy, exactly verified)\n               on the hardest surviving profiles listed in the artifacts:\
    \ the soundness was paid once in Lean,\n               so good parameters earn verified credit with no proof (metric schema_gain).\
    \ \"residue\" and\n               \"prefix\" are reserved and must stay [] (data there is a hard zero, artifact schema_error).\n\
    \  kill(...)    a Python mirror of candidate.kill: fast screening (counterexample battery, empirical band) and the\n \
    \              `agreement` metric. It never prunes and is never penalised, but it must never fire on a realizable case.\n\
    \nLEAN API (generated by `python -m zar_ub api --docstring initial_program.py` from lean/ZarPrune; lean/API.md has every\
    \ signature;\n  Mathlib IS available through `import ZarPrune`):\n  Basic:    Params Mat ind ind_le_one rowSum colSum\
    \ weight rowSum_le colSum_le weight_eq_sum_colSum Incr\n            HasKst Valid Profile profileOf profileOf_row profileOf_col\n\
    \  Sum:      sumFin allFin sumFin_succ allFin_succ sumFin_congr sumFin_const_zero sumFin_add sumFin_swap\n           \
    \ sumFin_le allFin_iff not_allFin_elim\n  Prune:    Prune never or ofList skip upper_bound_of_cover upper_bound_succ_of_cover\
    \ ZarPrune.Prune.mono\n  Prunes:   deficit mismatch rowCap colCap baseline\n  Counting: sumFin_eq_sum rowSum_eq_sum colSum_eq_sum\
    \ weight_eq_sum sumFin_succAbove support rowSupport\n            mem_support mem_rowSupport card_support card_rowSupport\
    \ incr_of_strictMono hasKst_of_subsets\n            card_powersetCard_eq_sum budget_general colBudget rowLocalBudget Params.transpose\
    \ transpose\n            Profile.swap rowSum_transpose colSum_transpose weight_transpose profileOf_transpose\n       \
    \     hasKst_transpose valid_transpose Prune.transposed rowBudget argA argAT fD gD cntLt boundD fD_mono\n            fD_layer_cake\
    \ sum_range_eq_sum_ite fD_layer_cake_le sum_fD_eq card_filter_ge boundD_le argD argDT\n            deleteCol deleteRow\
    \ colSum_deleteCol rowSum_deleteRow weight_deleteCol weight_deleteRow\n            Incr.succAbove_comp hasKst_of_deleteCol\
    \ not_hasKst_deleteCol hasKst_of_deleteRow\n            not_hasKst_deleteRow choose_tangent equalCost equalCost_le_sum_choose\
    \ waterfillBound\n            sum_le_waterfillBound colBudgetOf weight_le_waterfill valid_deleteCol_bound valid_deleteRow_bound\n\
    \            argDelCol argDelRow argDelColWF argDelRowWF argWF countingA countingD deletion counting\n  Cond:     Fact\
    \ FactHolds Fact.transpose factHolds_transpose FactHolds.ofBound factHolds_waterfill CondPrune\n            discharge\
    \ ofPrune weaken restate never or orSame ofList transposed argDelColF argDelRowF topIdx\n            topSum topIdx_nodup\
    \ topIdx_length minorCols colSum_minorCols weight_minorCols not_hasKst_minorCols\n            sum_orderEmbOfFin Prune.ofPrefixF\
    \ Prune.ofPrefixRowF\n  Schemas:  cntGt lowSum topSumF layer_cake layer_cake_le sum_f_eq card_filter_ge_of_set lowSum_le\
    \ le_topSumF\n            codeg codeg_comm codeg_le_left codeg_le_right codeg_le_n floor_le_codeg codeg_eq_sum sum_codeg_row\n\
    \            sum_sum_codeg sum_sum_codeg_choose pairLocalBudget f2 f2_mono f3 f3_mono budget3 Lcap cap floor T2\n    \
    \        codeg_le_cap pairIdx Mult decode coef coefOK Sys sysOf rhs certKills arrayGetD_ofFn coefOK_iff\n            farkas_sound\
    \ Prune.ofFarkas\n  DGH:      subsetLocalBudget dgh_round sum_powersetCard_filter dghD dghR dghCoef dghQuot dghBudget\n\
    \            dghViolated argDGHCol argDGHRow argDGH\n  Valid P A := ¬ HasKst P A ∧ P.w ≤ weight A  (so hv.1 : ¬ HasKst\
    \ P A, hv.2 : P.w ≤ weight A); profileOf_row / profileOf_col are @[simp]\n  Key statements:\n    colBudget (P : Params)\
    \ (A : Mat P.m P.n) (h : ¬ HasKst P A) : ∑ j, (colSum A j).choose P.s ≤ (P.t - 1) * (P.m).choose P.s\n    rowBudget (P\
    \ : Params) (A : Mat P.m P.n) (h : ¬ HasKst P A) : ∑ i, (rowSum A i).choose P.t ≤ (P.s - 1) * (P.n).choose P.t\n    rowLocalBudget\
    \ (P : Params) (A : Mat P.m P.n) (h : ¬ HasKst P A) (i : Fin P.m) (hs : 1 ≤ P.s) : ∑ j ∈ rowSupport A i, (colSum A j -\
    \ 1).choose (P.s - 1) ≤ (P.t - 1) * (P.m - 1).choose (P.s - 1)\n    valid_deleteCol_bound {m n s t w U : ℕ} (A : Mat m\
    \ (n + 1)) (j : Fin (n + 1)) (hU : ∀ B : Mat m n, ¬ HasKst ⟨m, n, s, t, 0⟩ B → weight B ≤ U) (hj : colSum A j + U < w)\
    \ : ¬ Valid ⟨m, n + 1, s, t, w⟩ A\n    sum_le_waterfillBound {n : ℕ} (m s B : ℕ) (hs : 1 ≤ s) (c : Fin n → ℕ) (hc : ∀\
    \ j, c j ≤ m) (hB : ∑ j, (c j).choose s ≤ B) : ∑ j, c j ≤ waterfillBound m n s B\n    argDelCol (P : Params) (U : ℕ) (hU\
    \ : ∀ B : Mat P.m (P.n - 1), ¬ HasKst ⟨P.m, P.n - 1, P.s, P.t, 0⟩ B → weight B ≤ U) : Prune P\n    argDelColF (P : Params)\
    \ (f : Fact) (h : f.m = P.m ∧ f.n + 1 = P.n ∧ f.s = P.s ∧ f.t = P.t) : CondPrune P [f]\n    Prune.ofPrefixF (P : Params)\
    \ (k : Nat) (f : Fact) (hk : k < P.n) (h : f.m = P.m ∧ f.n = k ∧ f.s = P.s ∧ f.t = P.t) : CondPrune P [f]\n    discharge\
    \ {facts : List Fact} (q : CondPrune P facts) (h : ∀ f ∈ facts, FactHolds f) : Prune P\n    ZarPrune.Prune.mono {P : ZarPrune.Params}\
    \ (p : ZarPrune.Prune P) (w' : Nat) (h : P.w ≤ w') : ZarPrune.Prune {P with w := w'}\n    pairLocalBudget (P : Params)\
    \ (A : Mat P.m P.n) (h : ¬ HasKst P A) (i i' : Fin P.m) (hii : i ≠ i') (hs : 2 ≤ P.s) : ∑ j ∈ rowSupport A i ∩ rowSupport\
    \ A i', (colSum A j - 2).choose (P.s - 2) ≤ (P.t - 1) * (P.m - 2).choose (P.s - 2)\n    codeg_le_cap (P : Params) (A :\
    \ Mat P.m P.n) (h : ¬ HasKst P A) (i i' : Fin P.m) (hii : i ≠ i') (hs : 2 ≤ P.s) : codeg A i i' ≤ cap P (profileOf A)\
    \ i i'\n    floor_le_codeg {m n : ℕ} (A : Mat m n) (i i' : Fin m) : rowSum A i + rowSum A i' - n ≤ codeg A i i'\n    sum_codeg_row\
    \ {m n : ℕ} (A : Mat m n) (i : Fin m) : ∑ i' ∈ univ.erase i, codeg A i i' = ∑ j ∈ rowSupport A i, (colSum A j - 1)\n \
    \   lowSum_le (f : ℕ → ℕ) (hf : Monotone f) {m n : ℕ} (pf : Profile m n) (hc : ∀ j, pf.col j ≤ m) (S : Finset (Fin n))\
    \ : lowSum f pf S.card ≤ ∑ j ∈ S, f (pf.col j)\n    Prune.ofFarkas (P : Params) (ys : List (List ℕ)) : Prune P\n    dghBudget\
    \ (P : Params) (A : Mat P.m P.n) (h : ¬ HasKst P A) (hs : 1 ≤ P.s) (k : ℕ) (hk : P.s ≤ k) : dghCoef P.m P.s P.t k * ∑\
    \ j, (colSum A j).choose (P.s - 1) ≤ dghCoef P.m P.s P.t k * dghQuot P.m P.s P.t k * P.m.choose (P.s - 1) + ∑ j, (k -\
    \ colSum A j) * (colSum A j).choose (P.s - 1)\n    argDGH (P : Params) : Prune P\n  Mathlib: Finset.sum_le_sum sum_comm\
    \ card_filter powersetCard, Nat.choose lemmas, omega decide simp linarith nlinarith ring positivity\n  Schemas (Schemas.lean,\
    \ proved): `Prune.ofFarkas P ys` kills when some certificate y in ys refutes the pair-codegree system F1-F4 (see SCHEMA_DATA[\"\
    farkas\"]); `Prune.ofResidue` is NOT in the library (SCHEMA_DATA[\"residue\"] / [\"prefix\"] must stay []).\n  DGH (DGH.lean,\
    \ proved for every (m,n;s,t)): `argDGH P` = the Davies-Gill-Horsley v = s-1 rounding inequality on both sides; it is a\
    \ library lemma but NOT in the scoring baseline, so listing it earns credit only on the wide cells where it fires.\n \
    \ Closure.lean / Evolved.lean: the closure seam (upper_bound_succ_of_condPrune) and the promoted library `evolved P` (already\
    \ in the baseline); not for candidates.\n  CondPrune entry point: besides `candidate` you may define `candidateF (P :\
    \ Params) (facts : List Fact) : CondPrune P facts` (general) or `candidateF : CondPrune target [f1, ...]` (literal facts);\
    \ the gate discharges it against the facts the run's ledger grants to each instance (none on pure/TRAIN tables; Tan's\
    \ cited neighbours on tan2022 target tables) and falls back to `CondPrune.never` where a literal fact is not granted (artifact\
    \ lean_cond).\n\nWORKED EXAMPLE -- this is `argA` from lean/ZarPrune/Counting.lean, verbatim; every new prune has this\
    \ shape:\n  def argA (P : Params) : Prune P where\n    name := \"argA: Σ_j C(c_j,s) ≤ (t-1)C(m,s)\"\n    kill := fun pf\
    \ =>\n      decide ((P.t - 1) * (P.m).choose P.s < sumFin P.n (fun j => (pf.col j).choose P.s))\n    sound := by\n   \
    \   intro A hk hv\n      have h1 : (P.t - 1) * (P.m).choose P.s < sumFin P.n (fun j => (colSum A j).choose P.s) :=\n \
    \       of_decide_eq_true hk\n      rw [sumFin_eq_sum] at h1\n      have h2 := colBudget P A hv.1\n      omega\n(hk :\
    \ kill (profileOf A) = true; hv : Valid P A, so hv.1 : ¬ HasKst P A and hv.2 : P.w ≤ weight A.)\n\nREWARD. Only the Lean-evaluated\
    \ kill of `candidate` (plus the harness-instantiated schemas from SCHEMA_DATA)\nearns credit: the difficulty-weighted\
    \ fraction (SAT solver conflicts) of the cases that SURVIVE the already\nproved library `counting` (Arguments A and D\
    \ on both sides, deletion with the waterfilled counting bound)\nthat your prunes kill, on training cells, open target\
    \ cells, a held-out (s,t) cell, and the hardest decile.\nA verified library that kills nothing scores exactly 0.20; no\
    \ unverified program can exceed 0.19 (partial\ncredit for how far the Lean file gets: parses < kills type-check < holes\
    \ remain < holes filled), and killing a\nrealizable case scores 0. Re-proving or re-listing library prunes earns nothing:\
    \ the baseline is already PROVED.\n\nWHERE THE ROOM IS. Look at the hardest surviving profiles in the artifacts (per_instance:\
    \ near-regular rows/cols\nof 6s, 7s and 8s) and find a NEW reason such a profile is empty:\n  * the Davies-Gill-Horsley\
    \ `v = s-1` rounding inequality (their constraint (4)): for each (s-1)-set X of rows,\n    Σ_{j ⊇ X} (c_j - s + 1) ≤ (t-1)(m-s+1);\
    \ with D = k-s+1, R = (t-1)(m-s+1), α = R mod D, c = (R-α)/D the\n    leftover α < D cannot buy a fraction of a column,\
    \ so for s ≤ k ≤ m:\n    Σ_{c_j<k} (c_j-s+1)·C(c_j,s-1) + (D-α)·Σ_{c_j≥k} C(c_j,s-1) ≤ (D-α)·c·C(m,s-1) + α·Σ_{c_j<k}\
    \ C(c_j,s-1)\n    (row dual with (t,s,n,m) swapped; check complete partitions only). It closes z(13,17) ≤ 116 and z(13,18)\
    \ ≤ 121\n    with zero SAT calls; it is proved in the library as `argDGH P` (DGH.lean) but not in the scoring baseline,\n\
    \    so it earns credit only on wide target cells -- on the square training cells it kills nothing, and the\n    room\
    \ there is in arguments that go BEYOND it (per-row rounding P10, general v P9 via `subsetLocalBudget`);\n  * cross-side\
    \ arguments coupling `rows` AND `cols` at once (a heavy row meets r columns, whose sums bound the\n    pair counts available\
    \ to the other rows; two-line deletions bounded by the (m-1, n-1) waterfill);\n  * residue / overlap arguments mod a small\
    \ g on the exceptional (lightest or heaviest) columns;\n  * Farkas combinations of the proved inequalities: put the multipliers\
    \ in SCHEMA_DATA[\"farkas\"], no proof needed.\nPrefer general prunes (parametric in P); instance-specific ones are scored\
    \ only where they type-check.\n\nSKETCHES ARE ACCEPTED. If you cannot finish `sound`, leave typed holes `have h : <statement>\
    \ := by sorry`\ninside the `sound := by` block (nowhere else): the harness tries omega/simp_all/decide/linarith/nlinarith/\n\
    positivity/grind and the library lemmas on each hole and reports the goals of those it cannot close in the\nlean_holes\
    \ artifact, so the next attempt (or you, now) can close them. Keep EVERY verified prune; when a Lean\nproof fails, the\
    \ exact error and goal are in the lean_errors artifact -- fix them rather than deleting the prune.\n\nALREADY PROVED (re-adding\
    \ them earns nothing): deficit, mismatch, rowCap/colCap, Argument A (argA/argAT),\nArgument D (argD/argDT), deletion vs\
    \ the waterfilled bound (argDelColWF/argDelRowWF/argWF), the DGH inequality\n(argDGH) and Argument I with ledgered facts.\
    \ Trivial arithmetic (w <= m*n, row sums add up) is already in\nthe baseline. Credit exists ONLY for cases the artifacts\
    \ list as still alive.\nSEARCH MODE THAT PAYS TODAY: in the Python part of the EVOLVE block write\n    from zar_ub.lemmas\
    \ import search_certificates\n    SCHEMA_DATA = {\"farkas\": search_certificates(max_seconds=40.0), \"residue\": [], \"\
    prefix\": []}\n(wrapped in try/except). It reads the case tables you are scored on, solves the pair-codegree LP for every\n\
    surviving case and returns Farkas certificates that the PROVED Lean schema `Prune.ofFarkas` re-checks --\nverified credit\
    \ with no new proof. Then improve on it: add hidden-variable inequalities the LP does not\nhave (prove them in Lean as\
    \ new `Prune`s), or filter/extend the certificate list.\nHOLES: if you cannot finish `sound`, leave typed holes `have\
    \ h : <statement> := by sorry` inside the\n`sound := by` block -- the harness tries omega/simp/decide/linarith and the\
    \ library lemmas on each and\nreports the goals it cannot close. A bare `sorry` elsewhere inside `sound := by` is tolerated\
    \ as an\nuntyped hole (no auto-fill, ladder capped at L2); a sorry anywhere else scores 0.\nNEVER edit the delimiters\
    \  LEAN_SOURCE = r\\'\\'\\'  and the closing  \\'\\'\\'  (a broken string literal makes\nthe whole program a SyntaxError\
    \ and scores 0).\nOUTPUT FORMAT (strict): your entire reply is SEARCH/REPLACE blocks, preceded by at most five lines of\n\
    explanation. Do NOT deliberate, enumerate options, or verify arithmetic in the reply -- a reply that runs\nout of tokens\
    \ before its first SEARCH/REPLACE block is discarded and earns nothing. Decide privately, then\nemit the blocks.\nIMPORTANT:\
    \ a change that adds no new mathematical content (re-listing, transposing an already symmetric\nbundle, cosmetic edits)\
    \ earns nothing. Attempt a SUBSTANTIVE new argument every time: the partial-credit\nterm rewards a serious Lean attempt\
    \ even if it does not fully compile, and a sound Python kill earns\nempirical credit on its own. Think briefly, then WRITE\
    \ THE CODE -- most of your output budget must be the\nSEARCH/REPLACE blocks, not deliberation. Your kill must never fire\
    \ on a realizable case.\n"
  template_variations:
    improvement_areas:
    - 'PROPOSE: add ONE new prune (a `def myPrune (P : Params) : Prune P where ...` in the argA shape) that kills at least
      one of the hardest surviving profiles listed in per_instance, append it to `candidate`, mirror it in kill(), and prove
      `sound` completely -- or leave typed `have h : ... := by sorry` holes for the harness to fill. Update NOTES with the
      argument.'
    - 'FILL: close the holes and fix the Lean errors of the CURRENT program (artifacts lean_holes / lean_errors give the exact
      goals and messages) so that every prune verifies (ladder L5). Do not add new prunes until the current ones verify; never
      delete a prune to make the file compile.'
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 16384
database:
  population_size: 60
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  feature_dimensions:
  - proven_gain
  - lean_ladder
  feature_bins:
    proven_gain: 10
    lean_ladder: 6
  migration_interval: 20
evaluator:
  timeout: 2400
  cascade_evaluation: false
  cascade_thresholds:
  - 0.005
  - 0.15
  parallel_evaluations: 1
  enable_artifacts: true
  use_llm_feedback: false
diff_based_evolution: true
max_code_length: 60000
